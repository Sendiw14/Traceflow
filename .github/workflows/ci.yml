name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TRACEFLOW_TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: services/trace-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache-dependency-path: |
            services/trace-api/go.sum
            examples/demo-system/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Generated API models match api/openapi.yaml
        run: |
          go generate ./internal/api
          git diff --exit-code internal/api/gen.go
      - name: go test -race (incl. PostgreSQL integration + OpenAPI contract tests)
        run: go test -race -count=1 ./...
      - run: go build ./cmd/server
      - name: demo-system vet + build
        working-directory: examples/demo-system
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go build ./...

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: OpenAPI lint
        run: npx -y @redocly/cli@2 lint api/openapi.yaml
      - name: Collector config validate
        run: docker run --rm -v "$PWD/infra/otel/collector.yaml:/c.yaml:ro" otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea validate --config=/c.yaml

  web:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: traceflow_test_auth
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TRACEFLOW_TEST_AUTH_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/traceflow_test_auth
      TRACEFLOW_REQUIRE_AUTH_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches api/openapi.yaml
        run: |
          pnpm -C apps/web gen:api
          git diff --exit-code apps/web/src/lib/api/generated
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web typecheck
      - name: Unit + auth integration tests (auth suite required, never skipped)
        run: pnpm -C apps/web test
      - run: pnpm -C apps/web build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [go, contracts, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make env
      - run: make up
      - name: Probe trace-api from the app network
        run: |
          set -a; . ./.env; set +a
          c(){ docker run --rm --network traceflow_app curlimages/curl:8.17.0 -s -o /dev/null -w "%{http_code}" "$@"; }
          test "$(c http://trace-api:8080/livez)" = 200
          test "$(c http://trace-api:8080/readyz)" = 200
          test "$(c http://trace-api:8080/v1/overview)" = 401
          auth=(-H "Authorization: Bearer $TRACEFLOW_SERVICE_TOKEN")
          test "$(c "${auth[@]}" http://trace-api:8080/v1/overview)" = 400            # from/to required
          test "$(c "${auth[@]}" "http://trace-api:8080/v1/overview?from=0&to=3600000000000")" = 200
          test "$(c "${auth[@]}" http://trace-api:8080/v1/no-such-endpoint)" = 404
      - name: Only web is published, and only on loopback
        run: |
          pubs=$(docker compose ps --format json | jq -rs 'flatten | .[] | .Service as $s | .Publishers[]? | select(.PublishedPort > 0) | "\($s) \(.URL):\(.PublishedPort)"' | sort -u)
          echo "$pubs"
          test "$pubs" = "web 127.0.0.1:3000"
      - name: Web container serves private routes no-store and runs non-root
        run: |
          curl -sfI http://127.0.0.1:3000/ > /dev/null
          curl -sI http://127.0.0.1:3000/app | tee /dev/stderr | grep -qi '^cache-control: private, no-store'
          uid=$(docker compose exec -T web id -u); echo "web uid=$uid"; test "$uid" != 0
      - name: Web cannot reach the database network
        run: |
          if docker compose exec -T web node -e "require('net').connect(5432,'postgres').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
            echo "web reached postgres"; exit 1
          fi
      - name: Demo SDK → Collector → trace-api → PostgreSQL (OTLP-18, DATA-01/05-08)
        run: |
          set -a; . ./.env; set +a
          docker compose --profile tools build load
          docker compose run --rm load > load.raw
          # keep only result lines; build/progress output must not count
          grep -E '^(normal|slow|error|parallel|missing-parent) [0-9a-f]{32} [0-9]{3}$' load.raw | tee load.out
          test "$(wc -l < load.out)" -eq 5
          q(){ docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "$1"; }
          shape(){ q "select span_count||' '||root_count||' '||orphan_count||' '||(error_span_count>0) from trace_summaries where trace_id=decode('$(awk -v s="$1" '$1==s{print $2}' load.out)','hex')"; }
          # traffic service also writes traces, so wait per scenario trace (Collector batches ~1 s).
          expect(){ for _ in $(seq 1 30); do [ "$(shape "$1")" = "$2" ] && return 0; sleep 2; done; echo "$1: got [$(shape "$1")] want [$2]"; return 1; }
          expect normal "6 1 0 false"
          expect slow "6 1 0 false"
          expect error "6 1 0 true"
          expect parallel "9 1 0 false"
          expect missing-parent "5 0 1 false"
          slow=$(q "select root_duration_nano from trace_summaries where trace_id=decode('$(awk '$1=="slow"{print $2}' load.out)','hex')")
          test "$slow" -ge 800000000
          test "$(q "select count(*) from ingestion_records where source='collector' and http_status=200")" -ge 1
      - name: Supply chain — vulnerability scan + SBOM (Trivy)
        env:
          TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          mkdir -p sbom "$HOME/.cache/trivy"
          t(){ docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/src" -w /src "$TRIVY" "$@"; }
          # Our images and lockfiles: fail on fixable CRITICAL/HIGH.
          for img in traceflow-trace-api traceflow-web traceflow-gateway; do
            t image --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$img"
            t image --quiet --format cyclonedx --output "sbom/$img.cdx.json" "$img"
          done
          t fs --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 .
          # Pinned third-party images: report only (upstream fixes), reviewed at release.
          t image --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 postgres:18.7
          t image --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 otel/opentelemetry-collector-contrib:0.165.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom/
          retention-days: 30
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Playwright journeys against the real stack (J-02/J-03/J-04, axe, 375 px)
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait trace-api
          set -a; . ./.env; set +a
          pnpm install --frozen-lockfile
          pnpm -C apps/web exec playwright install --with-deps chromium
          TRACE_API_URL=http://127.0.0.1:18080 pnpm -C apps/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
