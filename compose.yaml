# TRACEFLOW local-dev stack (docs/architecture/deployment-topology.md).
# Only web is published, and only on 127.0.0.1:3000. app/ingest/data networks are internal.
# Usage: make env && make up
name: traceflow

services:
  postgres:
    image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  trace-api:
    build: ./services/trace-api
    environment:
      TRACEFLOW_PROFILE: ${TRACEFLOW_PROFILE:?set in .env}
      TRACEFLOW_DATABASE_URL: ${TRACEFLOW_DATABASE_URL:?set in .env}
      TRACEFLOW_SERVICE_TOKEN: ${TRACEFLOW_SERVICE_TOKEN:?run make env}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [app, ingest, data]
    healthcheck:
      test: ["CMD", "/trace-api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      TRACEFLOW_PROFILE: ${TRACEFLOW_PROFILE:?set in .env}
      TRACE_API_URL: http://trace-api:8080
      TRACEFLOW_SERVICE_TOKEN: ${TRACEFLOW_SERVICE_TOKEN:?run make env}
    depends_on:
      trace-api: { condition: service_healthy }
    networks: [edge, app]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Demo system (examples/demo-system): synthetic traffic only.
  gateway: &demo
    build: ./examples/demo-system
    command: ["gateway"]
    depends_on:
      collector: { condition: service_started }
    networks: [ingest, demo]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  orders:
    <<: *demo
    command: ["orders"]
  inventory:
    <<: *demo
    command: ["inventory"]
  # One-shot: `docker compose run --rm load` prints "scenario trace_id status" per scenario.
  load:
    build: ./examples/demo-system
    command: ["load"]
    networks: [demo]
    profiles: [tools]
    depends_on: [gateway, orders, inventory]

  # local-dev only: steady synthetic traffic so the UI always has fresh traces.
  traffic:
    build: ./examples/demo-system
    command: ["load"]
    environment:
      DEMO_LOAD_INTERVAL: 15s
    networks: [demo]
    depends_on: [gateway, orders, inventory]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [ingest]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  edge: {}
  app: { internal: true }
  ingest: { internal: true }
  data: { internal: true }
  demo: { internal: true }

volumes:
  pgdata:
